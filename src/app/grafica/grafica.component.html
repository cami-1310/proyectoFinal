<div class="contenedor" #graficaContenedor>
  <h2>Total de reservaciones según la habitación</h2>
  
  <ngx-charts-bar-horizontal
    [view]="view"
    [scheme]="colorScheme"
    [schemeType]="schemeType"
    [results]="multi"
    [gradient]="gradient"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [legend]="showLegend"
    [legendPosition]="legendPosition"
    [showXAxisLabel]="showXAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [xAxisLabel]="xAxisLabel"
    [yAxisLabel]="yAxisLabel">
  </ngx-charts-bar-horizontal>
  <br><br>
</div>
